services:
  postgres:
    image: postgres:16-alpine
    container_name: cream-postgres
    environment:
      POSTGRES_USER: cream
      POSTGRES_PASSWORD: cream
      POSTGRES_DB: cream
    ports:
      - "5432:5432"
    volumes:
      - cream_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cream"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: cream-adminer
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  cream_pgdata:
