services:
  postgres:
    image: postgres:16-alpine
    container_name: cream-postgres
    environment:
      POSTGRES_USER: cream
      POSTGRES_PASSWORD: cream
      POSTGRES_DB: cream
    ports:
      - "5433:5432"
    volumes:
      - cream_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cream"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cream_pgdata:
